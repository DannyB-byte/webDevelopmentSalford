<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Personal Branding Website">
	<title>portfolio</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<header class="site-header">
		<div class="container header-inner">
			<a class="brand" href="#top">Daniel Boxall</a>
			<nav class="site-nav" aria-label="Main navigation">
				<ul>
					<li><a href="index.html">Home</a></li>
					<li><a href="ProblemSolving.html">Problem Solving</a></li>
					<li><a href="Business_showcase.html">Business Showcase</a></li>
					<li><a href="skills.html">Skills</a></li>
					<li><a href="contact.html">Contact</a></li>
				</ul>
			</nav>
		</div>
	</header>

	<main id="top">
		<section class="hero" aria-labelledby="hero-title">
			<div class="container hero-content">
				<h1 id="hero-title">Get In Touch</h1>
				<p class="hero-copy"></p></p>
			</div>
		</section>
		<section class="content" id="services" aria-labelledby="services-title">
			<div class="container">
				<div class="section-heading">
					<h2 id="services-title">Send a Message</h2>
					<p>Fill out the form below and I'll get back to you.</p>
				</div>
				<form class="contact-form" aria-label="Contact form">
					<label for="name">Name</label>
					<input type="text" id="name" name="name" placeholder="Your name" required>

					<label for="email">Email</label>
					<input type="email" id="email" name="email" placeholder="you@example.com" required>

					<label for="message">Message</label>
					<textarea id="message" name="message" rows="5" placeholder="Your message" required></textarea>

					<button type="button" onclick="alert('Your message has been received')">Send Message</button>
				</form>
			</div>
		</section>
	</main>

	<footer class="site-footer" id="contact">
		<div class="container">
			<p>&copy; 2026 Daniel Boxall. All rights reserved.</p>
		</div>
	</footer>
</body>
</html>
